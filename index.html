<style>
:root{--bg:#fdf8ef;--card:#fff;--tx:#1f3a4d;--mu:#5b7080;--bd:#d9d2c3;--ac:#1f6f7a;--acb:#e3f3f6;--ok:#27663a;--okb:#e3f3df;--no:#9b2c2c;--nob:#fbe4e4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14232b;--card:#1c313b;--tx:#e8f0f3;--mu:#9db2bc;--bd:#34505c;--ac:#6cc4cf;--acb:#1f4650;--ok:#8fd9a2;--okb:#1f4a2c;--no:#f2a3a3;--nob:#5a2626}}
:root[data-theme="dark"]{--bg:#14232b;--card:#1c313b;--tx:#e8f0f3;--mu:#9db2bc;--bd:#34505c;--ac:#6cc4cf;--acb:#1f4650;--ok:#8fd9a2;--okb:#1f4a2c;--no:#f2a3a3;--nob:#5a2626}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:24px;margin:0 0 4px}h2{font-size:18px;margin:28px 0 10px;color:var(--ac)}
.s{color:var(--mu);font-size:14px;margin:0 0 8px}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:0 0 12px}
.q p{margin:0 0 8px;font-size:15px}
.o{display:block;width:100%;text-align:left;margin:0 0 6px;padding:10px 12px;font:inherit;font-size:14px;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;cursor:pointer}
.o.sel{background:var(--acb);border-color:var(--ac);color:var(--ac)}
.o.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}
.o.no{background:var(--nob);border-color:var(--no);color:var(--no)}
.e{display:none;font-size:13px;color:var(--mu);margin:6px 0 0}
.b{width:100%;padding:12px;font:inherit;font-size:16px;color:#fff;background:var(--ac);border:0;border-radius:10px;cursor:pointer;margin-top:8px}
.b.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
#er{color:var(--no);font-size:14px;min-height:20px}
#res{display:none;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
#res b{font-size:22px}

.hd{display:flex;align-items:center;gap:8px;margin:0 0 4px}
.bk{padding:6px 10px;font:inherit;font-size:14px;color:var(--ac);background:none;border:1px solid var(--bd);border-radius:8px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.card{display:block;text-align:left;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;cursor:pointer}
.card:hover,.card:focus-visible{border-color:var(--ac)}
.card .n{font-size:17px;font-weight:700;color:var(--ac)}
.card .t{font-size:14px;color:var(--mu)}
.card .st{display:inline-block;margin-top:8px;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--acb);color:var(--ac)}
.card .st.d{background:var(--okb);color:var(--ok)}
.sum{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin:12px 0}
.sum h3{font-size:16px;margin:12px 0 6px;color:var(--ac)}.sum h3:first-child{margin-top:0}
.sum ul{margin:0;padding-left:20px;font-size:15px}.sum li{margin:0 0 4px}
.date{font-size:13px;color:var(--mu)}
.in{width:100%;box-sizing:border-box;padding:10px 12px;font:inherit;font-size:16px;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px}
</style>
</head>
<body>
<main>
<div id="v"></div>
</main>
<script src="questions.js?v=R6"></script>
<script>
var FORM_URL="https://docs.google.com/forms/d/e/1FAIpQLSdFYnyXlZ15uWp6VxyKBUfFc9O16wH4aI5zuG4Gsbx_PQbQPQ/formResponse",CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRaU9iJvFECFv4eG50d_4EVnMlTVaViKBTllN5kaaf14zqHHSdE7Sn83VfUIuzWpPTK1bevKio2znRl/pub?gid=828201747&single=true&output=csv";
var L="ABCD",v=document.getElementById("v");
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function curSet(s){return s.sets[s.sets.length-1]}
function key(i){return "daily:"+today()+":"+i}
function getRes(i){try{return JSON.parse(localStorage.getItem(key(i)))}catch(e){return null}}
function saveRes(i,r){try{localStorage.setItem(key(i),JSON.stringify(r))}catch(e){}}
function isSent(){try{return localStorage.getItem("sent:"+today())==="1"}catch(e){return false}}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function header(title,back){var h=el("div","hd");if(back){var b=el("button","bk","← "+back[0]);b.type="button";b.onclick=function(){location.hash=back[1]};h.appendChild(b)}h.appendChild(el("h1",null,title));v.appendChild(h)}
function btn(t,cls,fn){var b=el("button","b"+(cls?" "+cls:""),t);b.type="button";b.onclick=fn;v.appendChild(b);return b}
function home(){header("社工師每日練習");v.appendChild(el("p","s","選擇今天想練習的科目，每科 5 題。"));v.appendChild(el("p","date",today()));
var g=el("div","grid");S.forEach(function(s,i){var c=el("button","card");c.type="button";c.appendChild(el("div","n",s.n));c.appendChild(el("div","t",curSet(s).t));
var r=getRes(i);c.appendChild(el("span","st"+(r?" d":""),r?"今日已完成 "+r.c+"/5":"今日 5 題"));c.onclick=function(){location.hash="s"+i};g.appendChild(c)});v.appendChild(g);
btn("🏆 查看排行榜","g",function(){location.hash="lb"});btn("📚 摘要庫（歷次摘要）","g",function(){location.hash="lib"});sendBox();var sb=btn("📤 分享給朋友","g",share);sb.style.marginTop="20px";v.appendChild(el("p","s")).id="sh"}
function sendBox(){var n=0;S.forEach(function(s,i){if(getRes(i))n++});var b=el("div","sum");b.appendChild(el("h3",null,"送出今日成績"));v.appendChild(b);
if(isSent()){b.appendChild(el("p","s","今天的成績已送出，謝謝！"));return}
if(!n){b.appendChild(el("p","s","完成至少一科後，可以把成績送給管理者。"));return}
b.appendChild(el("p","s","送出後，管理者會看到你的暱稱、各科分數與每題選項。請不要填真實姓名，每天只能送出一次。"));
var inp=el("input","in");inp.maxLength=20;inp.placeholder="暱稱（必填）";b.appendChild(inp);
var lab=el("label");lab.style.cssText="display:block;font-size:14px;margin:8px 0";var cb=el("input");cb.type="checkbox";cb.checked=true;lab.appendChild(cb);lab.appendChild(document.createTextNode(" 同意在公開排行榜顯示我的暱稱與正確率"));b.appendChild(lab);var m=el("div");m.style.cssText="font-size:14px;min-height:20px;margin:6px 0";b.appendChild(m);
var sb=el("button","b","送出今日成績");sb.type="button";sb.onclick=function(){send(inp.value.trim(),cb.checked,m,sb)};b.appendChild(sb)}
function send(nk,sh,m,sb){if(!nk){m.textContent="請先填暱稱。";return}
var sc=[],an=[],C=0,T=0;S.forEach(function(s,i){var r=getRes(i);if(r){sc.push(s.n+" "+r.c+"/5");an.push(s.n+" "+r.a);C+=r.c;T+=5}});
var p=new URLSearchParams();p.append("entry.2115506951",nk);p.append("entry.123269248","d"+today().replace(/-/g,""));p.append("entry.1388538623",RID);p.append("entry.1893708105",sh?"yes":"no");p.append("entry.1732712050",C);p.append("entry.940690695",T);p.append("entry.1261228326",sc.join("；"));p.append("entry.498082469",an.join("；"));
sb.disabled=true;m.textContent="送出中…";
fetch(FORM_URL,{method:"POST",mode:"no-cors",body:p}).then(function(){try{localStorage.setItem("sent:"+today(),"1")}catch(e){}render()}).catch(function(){sb.disabled=false;m.textContent="送出失敗，請稍後再試。"})}
function share(){var u=location.origin+location.pathname,t="社工師每日練習，一起來練習！",m=document.getElementById("sh");
if(navigator.share){navigator.share({title:"社工師每日練習",text:t,url:u}).catch(function(){});return}
function ok(){m.textContent="已複製連結，可以貼給朋友了！"}
function fb(){var a=el("textarea");a.value=u;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){m.textContent="請複製這個連結："+u}a.remove()}
if(navigator.clipboard)navigator.clipboard.writeText(u).then(ok,fb);else fb()}
function subject(i){var s=S[i],st=curSet(s),r=getRes(i);header(s.n,["首頁",""]);v.appendChild(el("p","s","今日主題："+st.t));
if(r)v.appendChild(el("p","s","今日已完成，得分 "+r.c+" / 5。可以再看一次摘要或重新作答。"));
btn("📖 先看摘要","",function(){location.hash="m"+i});btn("✏️ 直接作答","g",function(){location.hash="q"+i})}
function getMode(){try{return localStorage.getItem("sumMode")||"full"}catch(e){return"full"}}
function setAt(s,k){return(k===undefined||!s.sets[k])?curSet(s):s.sets[k]}
function summary(i,k){var s=S[i],st=setAt(s,k),mode=getMode(),data=(mode==="short"&&st.sumShort)?st.sumShort:st.sum;header(s.n+"｜摘要",["返回",k===undefined?"s"+i:"lib"]);
if(st.sumShort){var tg=el("div");tg.style.cssText="display:flex;gap:8px;margin:8px 0";[["short","簡潔版"],["full","詳細版"]].forEach(function(o){var b=el("button","bk",o[1]);b.type="button";if(mode===o[0]){b.style.background="var(--acb)";b.style.borderColor="var(--ac)"}b.onclick=function(){try{localStorage.setItem("sumMode",o[0])}catch(e){}render()};tg.appendChild(b)});v.appendChild(tg)}
var box=el("div","sum");box.appendChild(el("h2",null,st.t)).style.marginTop="0";
data.forEach(function(sec){box.appendChild(el("h3",null,sec[0]));var ul=el("ul");sec[1].forEach(function(x){ul.appendChild(el("li",null,x))});box.appendChild(ul)});
v.appendChild(box);if(k===undefined)btn("看完了，開始作答","",function(){location.hash="q"+i})}
function library(){header("摘要庫",["首頁",""]);v.appendChild(el("p","s","歷次摘要都收在這裡，最新的在最上面。"));
S.forEach(function(s,i){v.appendChild(el("h2",null,s.n));for(var k=s.sets.length-1;k>=0;k--){(function(k){var st=s.sets[k];var b=el("button","o",(st.r?st.r+"｜":"")+st.t);b.type="button";b.onclick=function(){location.hash="m"+i+"-"+k};v.appendChild(b)})(k)}})}
function quiz(i){var s=S[i],st=curSet(s),A={},done=false,boxes=[];header(s.n+"｜今日 5 題",["返回","s"+i]);
v.appendChild(el("p","s",st.t+"：答完按「送出批改」，會顯示分數與解析。"));
st.qs.forEach(function(q,qi){var box=el("div","q");box.appendChild(el("p",null,(qi+1)+". "+q[0]));
q[1].forEach(function(o,oi){var b=el("button","o",L[oi]+". "+o);b.type="button";b.onclick=function(){if(done)return;A[qi]=oi;box.querySelectorAll(".o").forEach(function(x,k){x.classList.toggle("sel",k===oi)});er.textContent=""};box.appendChild(b)});
box.appendChild(el("div","e","解析："+q[3]));v.appendChild(box);boxes.push(box)});
var er=el("div");er.id="er";v.appendChild(er);var res=el("div");res.id="res";v.appendChild(res);
btn("送出批改","",function(){if(done)return;var n=Object.keys(A).length;if(n<st.qs.length){er.textContent="還有 "+(st.qs.length-n)+" 題未作答，答完再送出。";return}
done=true;var c=0,a="";st.qs.forEach(function(q,qi){var os=boxes[qi].querySelectorAll(".o");os[q[2]].classList.add("ok");a+=L[A[qi]];
if(A[qi]===q[2])c++;else os[A[qi]].classList.add("no");boxes[qi].querySelector(".e").style.display="block"});
saveRes(i,{c:c,a:a});res.innerHTML="";res.appendChild(el("b",null,c+" / "+st.qs.length));res.appendChild(el("div","s",c===st.qs.length?"全對，太棒了！":"看看解析，明天繼續加油。"));
res.style.display="block";res.scrollIntoView({behavior:"smooth",block:"center"})});
btn("重新作答","g",render);btn("回首頁送出成績或選其他科目","g",function(){location.hash=""})}
function csv(t){var r=[],row=[],f="",q=false,i,c;for(i=0;i<t.length;i++){c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"){row.push(f);r.push(row);row=[];f=""}else if(c!=="\r")f+=c}row.push(f);r.push(row);return r}
function board(){header("今日排行榜",["首頁",""]);var box=el("div","sum");v.appendChild(box);box.appendChild(el("p","s","載入中…"));
fetch(CSV_URL).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
var rows=csv(t).slice(1).map(function(x){return{n:x[0],c:+x[1],t:+x[2]}}).filter(function(x){return x.n&&x.t>0}).sort(function(a,b){return b.c/b.t-a.c/a.t||b.t-a.t});
box.innerHTML="";box.appendChild(el("h3",null,today()+" 排行榜"));
if(!rows.length){box.appendChild(el("p","s","今天還沒有人上榜。"));return}
var ol=el("ol");ol.style.cssText="margin:0;padding-left:24px;font-size:15px";
rows.forEach(function(x){ol.appendChild(el("li",null,x.n+"　"+Math.round(x.c/x.t*100)+"%（"+x.c+"/"+x.t+"）"))});box.appendChild(ol);
box.appendChild(el("p","s","只顯示今天、且同意公開的人。排名依正確率排序，相同時作答題數多者在前。資料約有幾分鐘延遲。"))}).catch(function(){box.innerHTML="";box.appendChild(el("p","s","排行榜暫時讀取不到，請稍後再試。"))})}
function render(){v.innerHTML="";var h=location.hash.slice(1),m=/^([smq])([0-5])(?:-(\d+))?$/.exec(h);if(h==="lb")board();else if(h==="lib")library();else if(!m)home();else{var i=+m[2];({s:subject,m:summary,q:quiz})[m[1]](i,m[3]===undefined?undefined:+m[3])}window.scrollTo(0,0)}
window.addEventListener("hashchange",render);render();
</script>
</body>
